<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://castelletm12b.cat/build/assets/question.js" defer></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse">
      <a-assets>
        <img id="imgdiamond" src="diamant_portal.png">
        <img id="imgend" src="end.png">
        <a-asset-item id="mundo" src="minecraft_landscape/scene.gltf"></a-asset-item>
        <a-asset-item id="pic" src="pico_de_diamante_-_minecraft_obj/scene.gltf"></a-asset-item>
        <audio id="audio1" src="minecraft-calm-sound.mp3" autoplay="true" loop="true"></audio>
      </a-assets>

      <!-- Modelo 3D como fondo -->
      <a-entity 
        gltf-model="#mundo"
        position="0 -30 -5"
        scale="10 10 10"
        rotation="0 180 0">
      </a-entity>

      <a-entity gltf-model="#pic" question="86" position="-7 -7 10" rotation="0 180 0" scale="1 1 1" 
      animation="property: position; dur: 10000; from: 18 -9 10; to: -8 -9 10; dir: alternate; loop: true">
      </a-entity>

      <a-plane question="74" position="2 -3 -12" rotation="0 0 0" width="5" height="5" src="#imgend" mylink="href: exercici3prova.html"></a-plane>
      <a-plane position="2 -3 20" rotation="0 180 0" width="5" height="5" src="#imgdiamond"></a-plane>
    </a-scene>

    <script>
      window.addEventListener('load', function() {
        var audio = document.getElementById('audio1');
        audio.play();
      });
    </script>
  </body>
</html>
