<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("mylink", {
        init: function() {  
         this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
           })
        }
      })
    </script>
    <script src="https://castelletm12b.cat/build/assets/question.js" defer></script>

  </head>
  <body>
  <a-scene cursor="rayOrigin: mouse">
    <a-assets>
      <img id="imgfondo" src="aether.png" >
      <img id="imgnether" src="end.webp" >
      <a-asset-item id="dragon" src="realistic_dragon_minecraft/scene.gltf"></a-asset-item>
      <a-asset-item id="enderman" src="minecraft_-_enderman/scene.gltf"></a-asset-item>
      <audio controls>
        <source src="audios/minecraft-calm-sound.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
      </audio>
    </a-assets>
   
    <a-entity camera look-controls wasd-controls="false">
     <a-entity cursor="fuse: true; fuseTimeout: 2000"
           position="0 0 -1"
           geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
           material="color: red; shader: flat"
           animation="property: components.material.material.color;
                 type: color;
                 to: white;
                 dur: 1000;
                 dir: alternate;
                 loop: true">
     </a-entity>
    </a-entity>
      <a-sky src="#imgnether"></a-sky>
      <a-entity gltf-model="#dragon" question="111" position="-100 100 -100" rotation="0 230 0" scale="10 10 10" transparent="true"
      animation="property: position; dur: 10000; from: -100 100 -100; to: 0 100 0; dir: alternate; loop: true">        
      </a-entity>
      <a-entity gltf-model="#enderman" position="0 -5 -8" rotation="0 340 0" scale="0.1 0.1 0.1" transparent="true"
      animation="property: position; dur: 10000; from: 0 -5 -8; to: -0 -5 8; dir: alternate; loop: true">        
      </a-entity>
      <!--animation="property: position; dur: 10000; from: -100 100 -100; to: 0 100 0; dir: alternate; loop: true"-->
     <!-- <a-plane position="-5 -5  6"  src="#imgfondo" rotation="0 120 0" scale="3 3 3" transparent="true" mylink="href: exercici4prova.html"></a-plane>-->
      <a-plane question="115" position="-5 -5  6" rotation="0 140 0" width="5" height="5" src="#imgfondo" ></a-plane>
  </body>
</html>
